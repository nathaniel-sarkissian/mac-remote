name: Verify public Never the Same release CDN
on:
  push:
    branches: [never-the-same-hatch-demo]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public entry and all imports from the free CDN
        shell: bash
        run: |
          set -euo pipefail
          base=https://rawcdn.githack.com/nathaniel-sarkissian/mac-remote/${GITHUB_SHA}
          for file in index.html src/never-the-same-main.js src/never-the-same.css src/never-the-same-geometry.js src/hatch-renderer.js src/geometry.js src/occlusion.js src/coverage.js src/earcut.js gpu.html src/gpu-meadow.js src/gpu-meadow-main.js src/gpu-orbit-camera.js src/gpu-meadow-geometry.js; do
            header=$(mktemp)
            body=$(mktemp)
            status=$(curl -L -sS -o "$body" -D "$header" -w '%{http_code}' --retry 2 --connect-timeout 15 --max-time 60 "$base/$file")
            echo "$file status=$status bytes=$(wc -c < "$body") mime=$(grep -i '^content-type:' "$header" | tail -1 | tr -d '\r')"
            test "$status" = 200
            test -s "$body"
            case "$file" in
              *.js) grep -qi 'javascript' "$header" ;;
              *.css) grep -qi 'text/css' "$header" ;;
              *.html) grep -qi 'text/html' "$header" ;;
            esac
            rm "$header" "$body"
          done
          echo 'All CDN resources are publicly served with correct MIME types.'
      - name: Check whether a real headless browser is available
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser || echo 'No browser installed; skipping optional GPU browser test.'
      - name: Load exact published assets in a real software-WebGL Chrome page
        shell: bash
        run: |
          set -euo pipefail
          base=https://rawcdn.githack.com/nathaniel-sarkissian/mac-remote/${GITHUB_SHA}
          mkdir -p /tmp/nts-local/src
          for file in index.html src/never-the-same-main.js src/never-the-same.css src/never-the-same-geometry.js src/hatch-renderer.js src/geometry.js src/occlusion.js src/coverage.js src/earcut.js gpu.html src/gpu-meadow.js src/gpu-meadow-main.js src/gpu-orbit-camera.js src/gpu-meadow-geometry.js; do
            curl -fLSs --retry 2 --connect-timeout 15 --max-time 60 "$base/$file" -o "/tmp/nts-local/$file"
          done
          # The CDN presents a confirmation page to automated HTML navigations.
          # The same verified bytes are served from a local HTTP server so that
          # Chrome executes the actual application instead of the notice screen.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/nts-local > /tmp/http.log 2>&1 &
          sleep 1
          url=http://127.0.0.1:8765/index.html
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=45000 \
            --window-size=1280,820 --dump-dom "$url" > /tmp/meadow-dom.html 2>/tmp/meadow-chrome.err
          python3 - <<'PY'
          import html,re
          source=open('/tmp/meadow-dom.html').read()
          m=re.search(r'<span id="stats">([^<]+)</span>',source)
          print('Rendered stats:',html.unescape(m.group(1)) if m else '(not found)')
          if not m or 'PLANTS' not in m.group(1) or 'MARKS' not in m.group(1) or '3600 PLANTS' not in m.group(1):
              print('HTML prefix:',source[:1000])
              print('Browser stderr:',open('/tmp/meadow-chrome.err').read()[-1800:])
              raise SystemExit('The original-geometry scene failed to initialize in Chrome')
          print('Actual WebGL page initialized with original geometry.')
          PY
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=45000 --window-size=1280,820 \
            --screenshot=/tmp/nts-hatch-screenshot.png "$url" \
            >/dev/null 2>/tmp/chrome-screenshot.err
          test -s /tmp/nts-hatch-screenshot.png
          file /tmp/nts-hatch-screenshot.png
          # The new route is an isolated GPU-generated geometry experiment.
          # The `smoke` mode draws one fully regenerated scene and exits,
          # preventing unbounded animation from hiding shader compilation bugs.
          gpuurl=http://127.0.0.1:8765/gpu.html?smoke=1
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=9000 \
            --window-size=1280,820 --dump-dom "$gpuurl" > /tmp/gpu-dom.html 2>/tmp/gpu-chrome.err
          python3 - <<'PY'
          import html,re
          source=open('/tmp/gpu-dom.html').read()
          status=re.search(r'<strong id="backend">([^<]+)</strong>',source)
          triangles=re.search(r'<p id="triangles">([^<]+)</p>',source)
          print('GPU meadow shader status:',html.unescape(status.group(1)) if status else '(not found)')
          print('GPU meadow triangles:',html.unescape(triangles.group(1)) if triangles else '(not found)')
          camera=re.search(r'<p id="cameraStatus">([^<]+)</p>',source)
          camera_value=html.unescape(camera.group(1)) if camera else ''
          print('GPU camera after shader-orbit/pan/zoom smoke test:',camera_value)
          if 'ZOOM 125%' not in camera_value or 'AZ 204' not in camera_value or 'EL 15' not in camera_value:
              print('Browser stderr:',open('/tmp/gpu-chrome.err').read()[-2400:])
              raise SystemExit('GPU camera shader controls did not update in Chrome')
          if not status or '/ READY' not in status.group(1) or not triangles or 'GENERATED TRIANGLES / FRAME' not in triangles.group(1):
              print('Browser stderr:',open('/tmp/gpu-chrome.err').read()[-2400:])
              raise SystemExit('GPU meadow vertex shader failed to compile or draw')
          print('Actual WebGL2 vertex shader geometry initialized successfully.')
          PY
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=9000 --window-size=1280,820 \
            --screenshot=/tmp/nts-gpu-screenshot.png "$gpuurl" >/dev/null 2>/tmp/gpu-screenshot.err
          test -s /tmp/nts-gpu-screenshot.png
          file /tmp/nts-gpu-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: never-the-same-hatch-browser
          path: |
            /tmp/nts-hatch-screenshot.png
            /tmp/nts-gpu-screenshot.png
