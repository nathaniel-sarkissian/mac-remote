name: Verify public Never the Same release CDN
on:
  push:
    branches: [never-the-same-hatch-demo]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public entry and all imports from the free CDN
        shell: bash
        run: |
          set -euo pipefail
          base=https://rawcdn.githack.com/nathaniel-sarkissian/mac-remote/${GITHUB_SHA}
          for file in index.html src/never-the-same-main.js src/never-the-same.css src/never-the-same-geometry.js src/hatch-renderer.js src/geometry.js src/occlusion.js src/coverage.js src/earcut.js gpu.html src/gpu-meadow.js src/gpu-meadow-main.js src/gpu-orbit-camera.js src/gpu-meadow-geometry.js src/gpu-meadow-mobile.js src/gpu-meadow-faithful.js; do
            header=$(mktemp)
            body=$(mktemp)
            status=$(curl -L -sS -o "$body" -D "$header" -w '%{http_code}' --retry 2 --connect-timeout 15 --max-time 60 "$base/$file")
            echo "$file status=$status bytes=$(wc -c < "$body") mime=$(grep -i '^content-type:' "$header" | tail -1 | tr -d '\r')"
            test "$status" = 200
            test -s "$body"
            case "$file" in
              *.js) grep -qi 'javascript' "$header" ;;
              *.css) grep -qi 'text/css' "$header" ;;
              *.html) grep -qi 'text/html' "$header" ;;
            esac
            rm "$header" "$body"
          done
          echo 'All CDN resources are publicly served with correct MIME types.'
      - name: Check whether a real headless browser is available
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser || echo 'No browser installed; skipping optional GPU browser test.'
      - name: Load exact published assets in a real software-WebGL Chrome page
        shell: bash
        run: |
          set -euo pipefail
          base=https://rawcdn.githack.com/nathaniel-sarkissian/mac-remote/${GITHUB_SHA}
          mkdir -p /tmp/nts-local/src
          for file in index.html src/never-the-same-main.js src/never-the-same.css src/never-the-same-geometry.js src/hatch-renderer.js src/geometry.js src/occlusion.js src/coverage.js src/earcut.js gpu.html src/gpu-meadow.js src/gpu-meadow-main.js src/gpu-orbit-camera.js src/gpu-meadow-geometry.js src/gpu-meadow-mobile.js src/gpu-meadow-faithful.js; do
            curl -fLSs --retry 2 --connect-timeout 15 --max-time 60 "$base/$file" -o "/tmp/nts-local/$file"
          done
          # The CDN presents a confirmation page to automated HTML navigations.
          # The same verified bytes are served from a local HTTP server so that
          # Chrome executes the actual application instead of the notice screen.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/nts-local > /tmp/http.log 2>&1 &
          sleep 1
          url=http://127.0.0.1:8765/index.html
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=45000 \
            --window-size=1280,820 --dump-dom "$url" > /tmp/meadow-dom.html 2>/tmp/meadow-chrome.err
          python3 - <<'PY'
          import html,re
          source=open('/tmp/meadow-dom.html').read()
          m=re.search(r'<span id="stats">([^<]+)</span>',source)
          print('Rendered stats:',html.unescape(m.group(1)) if m else '(not found)')
          if not m or 'PLANTS' not in m.group(1) or 'MARKS' not in m.group(1) or '3600 PLANTS' not in m.group(1):
              print('HTML prefix:',source[:1000])
              print('Browser stderr:',open('/tmp/meadow-chrome.err').read()[-1800:])
              raise SystemExit('The original-geometry scene failed to initialize in Chrome')
          print('Actual WebGL page initialized with original geometry.')
          PY
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=45000 --window-size=1280,820 \
            --screenshot=/tmp/nts-hatch-screenshot.png "$url" \
            >/dev/null 2>/tmp/chrome-screenshot.err
          test -s /tmp/nts-hatch-screenshot.png
          file /tmp/nts-hatch-screenshot.png
          # The new route is an isolated GPU-generated geometry experiment.
          # The `smoke` mode draws one fully regenerated scene and exits,
          # preventing unbounded animation from hiding shader compilation bugs.
          # Capture the original 45-degree reset-camera composition too.
          # This uses the unmodified, continuously regenerating published page.
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=1500 --window-size=1280,820 \
            --screenshot=/tmp/nts-gpu-default.png http://127.0.0.1:8765/gpu.html \
            >/dev/null 2>/tmp/gpu-default.err
          test -s /tmp/nts-gpu-default.png
          file /tmp/nts-gpu-default.png
          gpuurl=http://127.0.0.1:8765/gpu.html?smoke=1
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=9000 \
            --window-size=1280,820 --dump-dom "$gpuurl" > /tmp/gpu-dom.html 2>/tmp/gpu-chrome.err
          python3 - <<'PY'
          import html,re
          source=open('/tmp/gpu-dom.html').read()
          status=re.search(r'<strong id="backend">([^<]+)</strong>',source)
          triangles=re.search(r'<p id="triangles">([^<]+)</p>',source)
          print('GPU meadow shader status:',html.unescape(status.group(1)) if status else '(not found)')
          print('GPU meadow triangles:',html.unescape(triangles.group(1)) if triangles else '(not found)')
          bloom=re.search(r'<p id="bloomPixels"[^>]*>([^<]*)</p>',source)
          blooms=html.unescape(bloom.group(1)) if bloom else ''
          print('Actual warm flower pixels (full, grass-free):',blooms)
          # Inspect the actual desktop 3D flower pass, not warm pixels from grass.
          isolated=re.search(r'<p id="flowerOnlyPixels"[^>]*>([^<]*)</p>',source)
          span=re.search(r'<p id="flowerSpanPixels"[^>]*>([^<]*)</p>',source)
          flower_only=html.unescape(isolated.group(1)) if isolated else ''
          span_text=html.unescape(span.group(1)) if span else ''
          print('Desktop isolated 3D flowers:',flower_only,'span:',span_text)
          if 'INDEXED 3D' not in source:
              raise SystemExit('Indexed GPU flower renderer version marker missing')
          n=re.fullmatch(r'(\d+) FLOWER-ONLY',flower_only)
          width=re.fullmatch(r'(\d+) PX SPAN',span_text)
          if not n or not width or int(n.group(1))<250 or int(width.group(1))<300:
              raise SystemExit('Desktop source 3D flowers missing or confined to a strip')
          build=re.search(r'<p id="buildMark">([^<]+)</p>',source)
          print('Build marker:',build.group(1) if build else '(missing)')
          if not build or 'FLOWER-VISIBLE' not in build.group(1) or 'STATIC CACHE' not in build.group(1):
              raise SystemExit('Old cached GPU meadow page, not the new laptop fix')
          m=re.fullmatch(r'(\d+) FULL / (\d+) NO-GRASS',blooms)
          if not m or min(int(m.group(1)),int(m.group(2)))<16:
              raise SystemExit('GPU rendered no flower pixels: grass-only regression')
          camera=re.search(r'<p id="cameraStatus">([^<]+)</p>',source)
          camera_value=html.unescape(camera.group(1)) if camera else ''
          print('GPU camera after shader-orbit/pan/zoom smoke test:',camera_value)
          error=re.search(r'<div id="error"[^>]*>(.*?)</div>',source,re.S)
          if error:
              print('Browser GPU error:',html.unescape(error.group(1))[:6000])
          if 'ZOOM 125%' not in camera_value or 'AZ 204' not in camera_value or 'EL 57' not in camera_value:
              print('Browser stderr:',open('/tmp/gpu-chrome.err').read()[-2400:])
              raise SystemExit('GPU camera shader controls did not update in Chrome')
          if not status or '/ READY' not in status.group(1) or not triangles or 'GENERATED TRIANGLES / FRAME' not in triangles.group(1):
              print('Browser stderr:',open('/tmp/gpu-chrome.err').read()[-2400:])
              raise SystemExit('GPU meadow vertex shader failed to compile or draw')
          print('Actual WebGL2 vertex shader geometry initialized successfully.')
          PY
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=9000 --window-size=1280,820 \
            --screenshot=/tmp/nts-gpu-screenshot.png "$gpuurl" >/dev/null 2>/tmp/gpu-screenshot.err
          test -s /tmp/nts-gpu-screenshot.png
          file /tmp/nts-gpu-screenshot.png
          # Source geometry, both petal polygons and centers, without grass
          # or leaf occlusion. Desktop-only isolated screenshot is mandatory.
          desktopflowers="http://127.0.0.1:8765/gpu.html?smoke=1&focus=1&layer=flowers"
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --virtual-time-budget=9000 --window-size=1280,820 \
            --screenshot=/tmp/nts-gpu-desktop-flowers-only.png "$desktopflowers" \
            >/dev/null 2>/tmp/gpu-desktop-flower.err
          test -s /tmp/nts-gpu-desktop-flowers-only.png
          file /tmp/nts-gpu-desktop-flowers-only.png
          # Reproduce the iPhone screenshot's actual AZ185 / EL30 / 77%
          # camera angle, with the canvas occupying the entire viewport.
          mobileurl="http://127.0.0.1:8765/gpu.html?smoke=1&focus=1&userView=1"
          # Verify flower visibility at phone viewport dimensions too. This
          # catches cases where the grass-only geometry draws but complex
          # plant vertex work fails to render on narrow screens.
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --force-device-scale-factor=2 \
            --virtual-time-budget=9500 --window-size=430,844 \
            --dump-dom "$mobileurl" > /tmp/gpu-mobile-dom.html 2>/tmp/gpu-mobile-chrome.err
          python3 - <<'PY'
          import html,re
          source=open('/tmp/gpu-mobile-dom.html').read()
          status=re.search(r'<strong id="backend">([^<]+)</strong>',source)
          triangle=re.search(r'<p id="triangles">([^<]*)</p>',source)
          flowers=re.search(r'<p id="bloomPixels"[^>]*>([^<]*)</p>',source)
          t=html.unescape(triangle.group(1)) if triangle else ''
          f=html.unescape(flowers.group(1)) if flowers else ''
          m=re.fullmatch(r'(\d+) FULL / (\d+) NO-GRASS',f)
          print('Mobile Chrome GPU flower pixels:',f)
          print('Mobile shader geometry:',t)
          if not status or 'ORIGINAL 3D GEOMETRY' not in status.group(1):
              print('Browser GPU HTML:',source[-1400:])
              raise SystemExit('Phone GPU renderer did not use source 2025 geometry shader')
          errors=re.search(r'<p id="gpuErrors">([^<]*)</p>',source)
          diagnostics=html.unescape(errors.group(1)) if errors else '(missing)'
          print('Mobile GPU draw diagnostics:',diagnostics)
          isolated=re.search(r'<p id="flowerOnlyPixels"[^>]*>([^<]*)</p>',source)
          flower_only=html.unescape(isolated.group(1)) if isolated else ''
          print('Actual isolated blossom-only framebuffer pixels:',flower_only)
          isolated_match=re.fullmatch(r'(\d+) FLOWER-ONLY',flower_only)
          spread=re.search(r'<p id="flowerSpanPixels"[^>]*>([^<]*)</p>',source)
          span_text=html.unescape(spread.group(1)) if spread else ''
          print('Flower-only bloom width across actual phone frame:',span_text)
          span_match=re.fullmatch(r'(\d+) PX SPAN',span_text)
          if not isolated_match or int(isolated_match.group(1))<250:
              raise SystemExit('NO real flower heads in isolated GPU bloom pass')
          if not span_match or int(span_match.group(1))<int(0.32*860):
              raise SystemExit('Blossom heads still confined to first 450 planting sites / left edge')
          if diagnostics != 'No WebGL draw errors':
              raise SystemExit('Mobile GPU reported WebGL draw errors: '+diagnostics)
          camera=re.search(r'<p id="cameraStatus">([^<]+)</p>',source)
          angle=html.unescape(camera.group(1)) if camera else ''
          print('Reproduced iPhone camera:',angle)
          if not status or '/ READY' not in status.group(1) or not m or min(int(m.group(1)),int(m.group(2)))<16 or '13 RING POINTS' not in t or 'AZ 185' not in angle or 'EL 30' not in angle or 'ZOOM 77%' not in angle:
              print('Chrome stderr:',open('/tmp/gpu-mobile-chrome.err').read()[-2500:])
              raise SystemExit('iPhone-angle GPU meadow must visibly render flowers with full source silhouettes')
          PY
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --force-device-scale-factor=2 \
            --virtual-time-budget=9000 --window-size=430,844 \
            --screenshot=/tmp/nts-gpu-mobile.png "$mobileurl" >/dev/null 2>/tmp/gpu-mobile-image.err
          test -s /tmp/nts-gpu-mobile.png
          file /tmp/nts-gpu-mobile.png
          # The flower-only frame proves real source petal polygons exist,
          # distinct from yellow foliage and grass pixel counts.
          flowerurl="http://127.0.0.1:8765/gpu.html?smoke=1&focus=1&userView=1&headsOnly=1"
          timeout 180s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --disable-gpu-sandbox --force-device-scale-factor=2 \
            --virtual-time-budget=9000 --window-size=430,844 \
            --screenshot=/tmp/nts-gpu-flower-only.png "$flowerurl" >/dev/null 2>/tmp/gpu-flowers-only.err
          test -s /tmp/nts-gpu-flower-only.png
          file /tmp/nts-gpu-flower-only.png
      - uses: actions/upload-artifact@v4
        with:
          name: never-the-same-hatch-browser
          path: |
            /tmp/nts-hatch-screenshot.png
            /tmp/nts-gpu-screenshot.png
            /tmp/nts-gpu-desktop-flowers-only.png
            /tmp/nts-gpu-default.png
            /tmp/nts-gpu-mobile.png
            /tmp/nts-gpu-flower-only.png
